[project]
name = "customer-analyst"
version = "1.0.0"
description = "Customer analyst A2A agent with MCP-backed MongoDB access"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "fastmcp>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
