apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-analyst-config
  labels:
    app: customer-analyst
data:
  PORT: "8084"
  AGENT_ENDPOINT: "http://customer-analyst:8084"
  MONGODB_MCP_URL: "http://mongodb-mcp:8082"
  EVENT_HUB_URL: "http://event-hub:8080"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: customer-analyst-secrets
  labels:
    app: customer-analyst
type: Opaque
stringData:
  MODEL_ENDPOINT: "<TODO>"
  MODEL_NAME: "<TODO>"
  MODEL_API_KEY: "<TODO>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-analyst
  labels:
    app: customer-analyst
    app.kubernetes.io/name: customer-analyst
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-analyst
  template:
    metadata:
      labels:
        app: customer-analyst
    spec:
      containers:
      - name: customer-analyst
        image: quay.io/jonkey/marketing-assistant/customer-analyst:1.0
        ports:
        - containerPort: 8084
          protocol: TCP
        envFrom:
        - configMapRef:
            name: customer-analyst-config
        - secretRef:
            name: customer-analyst-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-analyst
  labels:
    app: customer-analyst
spec:
  selector:
    app: customer-analyst
  ports:
  - name: http
    port: 8084
    targetPort: 8084
    protocol: TCP
  type: ClusterIP
