apiVersion: v1
kind: ConfigMap
metadata:
  name: imagegen-mcp-config
  labels:
    app: imagegen-mcp
data:
  PORT: "8083"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.kagenti-system.svc.cluster.local:8335"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.kagenti-system.svc.cluster.local:8335/v1/traces"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
  MLFLOW_EXPERIMENT_NAME: "marketing-assistant"
  OTEL_SERVICE_NAME: "imagegen-mcp"
  OTEL_METRICS_EXPORTER: "none"
---
apiVersion: v1
kind: Secret
metadata:
  name: imagegen-mcp-secrets
  labels:
    app: imagegen-mcp
type: Opaque
stringData:
  MODEL_ENDPOINT: "https://flux2-klein-4b-predictor.models.svc.cluster.local:8443/v1"
  MODEL_NAME: "flux2-klein-4b"
  MODEL_API_KEY: "<TODO>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagegen-mcp
  labels:
    app: imagegen-mcp
    app.kubernetes.io/name: imagegen-mcp
    app.kubernetes.io/component: mcp
    kagenti.io/type: tool
    kagenti.io/transport: streamable_http
    protocol.kagenti.io/mcp: ''
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: imagegen-mcp
  template:
    metadata:
      labels:
        app: imagegen-mcp
        kagenti.io/type: tool
        kagenti.io/transport: streamable_http
        protocol.kagenti.io/mcp: ''
    spec:
      containers:
      - name: imagegen-mcp
        image: quay.io/jonkey/marketing-assistant/imagegen-mcp:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          protocol: TCP
        envFrom:
        - configMapRef:
            name: imagegen-mcp-config
        - secretRef:
            name: imagegen-mcp-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: imagegen-mcp
  labels:
    app: imagegen-mcp
    kagenti.io/type: tool
    protocol.kagenti.io/mcp: ''
spec:
  selector:
    app: imagegen-mcp
  ports:
  - name: http
    port: 8083
    targetPort: 8083
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: imagegen-mcp-mcp
  labels:
    app: imagegen-mcp
    kagenti.io/type: tool
    protocol.kagenti.io/mcp: ''
spec:
  selector:
    app: imagegen-mcp
  ports:
  - name: mcp
    port: 8000
    targetPort: 8083
    protocol: TCP
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: imagegen-mcp-route
spec:
  parentRefs:
  - name: mcp-gateway
    namespace: gateway-system
    sectionName: mcps
  hostnames:
  - imagegen-mcp.marketing.svc.cluster.local
  rules:
  - backendRefs:
    - name: imagegen-mcp
      port: 8083
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: imagegen-mcp
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: imagegen-mcp-route
  path: /mcp
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: imagegen-mcp-gateway-only
spec:
  selector:
    matchLabels:
      app: imagegen-mcp
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["gateway-system", "mcp-system", "kagenti-system"]
