[project]
name = "imagegen-mcp"
version = "1.0.0"
description = "Image generation MCP server with vLLM backend and placeholder fallback"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "mlflow>=3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
