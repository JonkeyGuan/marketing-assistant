[project]
name = "delivery-manager"
version = "1.0.0"
description = "Email generation and campaign deployment A2A agent"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.2.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "kubernetes>=28.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
