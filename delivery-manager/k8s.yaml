apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-manager-config
  labels:
    app: delivery-manager
data:
  PORT: "8087"
  AGENT_ENDPOINT: "http://delivery-manager:8087"
  CAMPAIGN_API_URL: "http://campaign-api:8089"
  EVENT_HUB_URL: "http://event-hub:8080"
  CLUSTER_DOMAIN: "<TODO>"
  DEV_NAMESPACE: "marketing-dev"
  PROD_NAMESPACE: "marketing-prod"
  APP_NAMESPACE: "marketing"
  LANDING_IMAGE: "quay.io/jonkey/marketing-assistant/campaign-landing:2.0"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.kagenti-system.svc.cluster.local:8335"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.kagenti-system.svc.cluster.local:8335/v1/traces"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
  MLFLOW_EXPERIMENT_NAME: "marketing-assistant"
  OTEL_SERVICE_NAME: "delivery-manager"
  OTEL_METRICS_EXPORTER: "none"
---
apiVersion: v1
kind: Secret
metadata:
  name: delivery-manager-secrets
  labels:
    app: delivery-manager
type: Opaque
stringData:
  MODEL_ENDPOINT: "https://qwen3-32b-fp8-dynamic-predictor.models.svc.cluster.local:8443/v1"
  MODEL_NAME: "qwen3-32b-fp8-dynamic"
  MODEL_API_KEY: "<TODO>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-manager
  labels:
    app: delivery-manager
    app.kubernetes.io/name: delivery-manager
    app.kubernetes.io/component: agent
    kagenti.io/type: agent
    kagenti.io/framework: Python
    protocol.kagenti.io/a2a: ''
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-manager
  template:
    metadata:
      labels:
        app: delivery-manager
        kagenti.io/type: agent
        kagenti.io/framework: Python
        protocol.kagenti.io/a2a: ''
    spec:
      serviceAccountName: delivery-manager
      containers:
      - name: delivery-manager
        image: quay.io/jonkey/marketing-assistant/delivery-manager:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8087
          protocol: TCP
        envFrom:
        - configMapRef:
            name: delivery-manager-config
        - secretRef:
            name: delivery-manager-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-manager
  labels:
    app: delivery-manager
    kagenti.io/type: agent
    protocol.kagenti.io/a2a: ''
spec:
  selector:
    app: delivery-manager
  ports:
  - name: http
    port: 8087
    targetPort: 8087
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: delivery-manager-deployer
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - create
  - update
  - patch
  - delete
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  verbs:
  - get
  - list
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: delivery-manager-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: delivery-manager-deployer
subjects:
- kind: ServiceAccount
  name: delivery-manager
  namespace: "<TODO>"
