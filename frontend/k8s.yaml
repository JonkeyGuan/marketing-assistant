apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: frontend
data:
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-keycloak-config
  labels:
    app: frontend
data:
  keycloak-config.js: |
    window.__KEYCLOAK_URL__ = "";
    window.__KEYCLOAK_REALM__ = "kagenti";
    window.__KEYCLOAK_CLIENT_ID__ = "marketing-ui";
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: quay.io/jonkey/marketing-assistant/frontend:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-keycloak-config
              key: keycloak-config.js
              optional: true
        envFrom:
        - configMapRef:
            name: frontend-config
        volumeMounts:
        - name: keycloak-config
          mountPath: /usr/share/nginx/html/keycloak-config.js
          subPath: keycloak-config.js
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: keycloak-config
        configMap:
          name: frontend-keycloak-config
          optional: true
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
