[project]
name = "mongodb-mcp"
version = "1.0.0"
description = "Customer database MCP server with MongoDB backend"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pymongo>=4.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
