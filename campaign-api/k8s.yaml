apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-api-config
  labels:
    app: campaign-api
data:
  PORT: "8089"
  CAMPAIGN_DIRECTOR_URL: "http://campaign-director:8088"
  POLICY_GUARDIAN_URL: "http://policy-guardian:8085"
  EVENT_HUB_URL: "http://event-hub:8080"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  HAP_DETECTOR_URL: "http://guardrails-detector-ibm-hap-predictor.models.svc.cluster.local:8000"
  PROMPT_INJECTION_URL: "http://prompt-injection-detector-predictor.models.svc.cluster.local:8000"
  ORCHESTRATOR_URL: ""
  ASSET_STORAGE_PATH: "/data/campaigns"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-api
  labels:
    app: campaign-api
    app.kubernetes.io/name: campaign-api
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campaign-api
  template:
    metadata:
      labels:
        app: campaign-api
    spec:
      containers:
      - name: campaign-api
        image: quay.io/jonkey/marketing-assistant/campaign-api:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8089
          protocol: TCP
        envFrom:
        - configMapRef:
            name: campaign-api-config
        volumeMounts:
        - name: campaign-data
          mountPath: /data/campaigns
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: campaign-data
        persistentVolumeClaim:
          claimName: campaign-api-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campaign-api-data
  labels:
    app: campaign-api
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: campaign-api
  labels:
    app: campaign-api
spec:
  selector:
    app: campaign-api
  ports:
  - name: http
    port: 8089
    targetPort: 8089
    protocol: TCP
  type: ClusterIP
