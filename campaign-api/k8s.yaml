apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-api-config
  labels:
    app: campaign-api
data:
  PORT: "8089"
  CAMPAIGN_DIRECTOR_URL: "http://campaign-director:8088"
  POLICY_GUARDIAN_URL: "http://policy-guardian:8085"
  EVENT_HUB_URL: "http://event-hub:8080"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-api
  labels:
    app: campaign-api
    app.kubernetes.io/name: campaign-api
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campaign-api
  template:
    metadata:
      labels:
        app: campaign-api
    spec:
      containers:
      - name: campaign-api
        image: quay.io/jonkey/marketing-assistant/campaign-api:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8089
          protocol: TCP
        envFrom:
        - configMapRef:
            name: campaign-api-config
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8089
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8089
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8089
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: campaign-api
  labels:
    app: campaign-api
spec:
  selector:
    app: campaign-api
  ports:
  - name: http
    port: 8089
    targetPort: 8089
    protocol: TCP
  type: ClusterIP
