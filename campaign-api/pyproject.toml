[project]
name = "campaign-api"
version = "1.0.0"
description = "REST API gateway for React frontend, routes to Campaign Director via A2A"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "gunicorn>=22.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "a2a-sdk>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
