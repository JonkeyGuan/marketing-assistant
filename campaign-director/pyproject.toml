[project]
name = "campaign-director"
version = "1.0.0"
description = "LangGraph campaign orchestrator with A2A agent coordination"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.2.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
