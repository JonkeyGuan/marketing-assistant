apiVersion: v1
kind: ConfigMap
metadata:
  name: event-hub-config
  labels:
    app: event-hub
data:
  PORT: "8080"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-hub
  labels:
    app: event-hub
    app.kubernetes.io/name: event-hub
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-hub
  template:
    metadata:
      labels:
        app: event-hub
    spec:
      containers:
      - name: event-hub
        image: quay.io/jonkey/marketing-assistant/event-hub:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: event-hub-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: event-hub
  labels:
    app: event-hub
spec:
  selector:
    app: event-hub
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
