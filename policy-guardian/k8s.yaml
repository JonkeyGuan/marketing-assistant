apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-guardian-config
  labels:
    app: policy-guardian
data:
  PORT: "8085"
  AGENT_ENDPOINT: "http://policy-guardian:8085"
  EVENT_HUB_URL: "http://event-hub:8080"
  CONFIG_SERVICE_URL: "http://config-service:8081"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.kagenti-system.svc.cluster.local:8335"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.kagenti-system.svc.cluster.local:8335/v1/traces"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
  MLFLOW_EXPERIMENT_NAME: "marketing-assistant"
  OTEL_SERVICE_NAME: "policy-guardian"
---
apiVersion: v1
kind: Secret
metadata:
  name: policy-guardian-secrets
  labels:
    app: policy-guardian
type: Opaque
stringData:
  MODEL_ENDPOINT: "https://qwen3-32b-fp8-dynamic-predictor.models.svc.cluster.local:8443/v1"
  MODEL_NAME: "qwen3-32b-fp8-dynamic"
  MODEL_API_KEY: "<TODO>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-guardian
  labels:
    app: policy-guardian
    app.kubernetes.io/name: policy-guardian
    app.kubernetes.io/component: agent
    kagenti.io/type: agent
    kagenti.io/framework: Python
    protocol.kagenti.io/a2a: ''
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-guardian
  template:
    metadata:
      labels:
        app: policy-guardian
        kagenti.io/type: agent
        kagenti.io/framework: Python
        protocol.kagenti.io/a2a: ''
    spec:
      serviceAccountName: policy-guardian
      containers:
      - name: policy-guardian
        image: quay.io/jonkey/marketing-assistant/policy-guardian:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8085
          protocol: TCP
        envFrom:
        - configMapRef:
            name: policy-guardian-config
        - secretRef:
            name: policy-guardian-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: policy-guardian
  labels:
    app: policy-guardian
    kagenti.io/type: agent
    protocol.kagenti.io/a2a: ''
spec:
  selector:
    app: policy-guardian
  ports:
  - name: http
    port: 8085
    targetPort: 8085
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-guardian
