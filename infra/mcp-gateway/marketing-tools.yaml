# Register marketing MCP tools with MCP Gateway v0.6.0
# Apply after deploy.sh: oc apply -f infra/mcp-gateway/marketing-tools.yaml -n marketing
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: imagegen-mcp-route
spec:
  parentRefs:
  - name: mcp-gateway
    namespace: gateway-system
    sectionName: mcps
  hostnames:
  - imagegen-mcp.mcp-system.svc.cluster.local
  rules:
  - backendRefs:
    - name: imagegen-mcp
      port: 8083
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: imagegen-mcp
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: imagegen-mcp-route
  path: /mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mongodb-mcp-route
spec:
  parentRefs:
  - name: mcp-gateway
    namespace: gateway-system
    sectionName: mcps
  hostnames:
  - mongodb-mcp.mcp-system.svc.cluster.local
  rules:
  - backendRefs:
    - name: mongodb-mcp
      port: 8082
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: mongodb-mcp
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mongodb-mcp-route
  path: /mcp
