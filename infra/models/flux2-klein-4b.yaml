---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flux2-klein-4b
  labels:
    app.kubernetes.io/component: models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/serving-runtime-scope: global
    opendatahub.io/template-display-name: vLLM Omni (Multimodal) NVIDIA ServingRuntime for KServe
    openshift.io/display-name: vLLM Omni (Multimodal) NVIDIA ServingRuntime for KServe
  name: flux2-klein-4b
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  storageHelper:
    disabled: true
  containers:
    - args:
        - serve
        - 'black-forest-labs/FLUX.2-klein-4B'
        - '--omni'
        - '--port=8080'
        - '--served-model-name={{.Name}}'
        - '--host=0.0.0.0'
        - '--gpu-memory-utilization=0.90'
        - '--trust-remote-code'
      command:
        - vllm
      env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /mnt/models
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: VLLM_ATTENTION_BACKEND
          value: FLASH_ATTN
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: 'expandable_segments:True'
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: FLASHINFER_WORKSPACE_DIR
          value: /tmp/flashinfer
        - name: TRITON_CACHE_DIR
          value: /tmp/triton_cache
      image: 'vllm/vllm-omni:v0.18.0'
      name: kserve-container
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 12Gi
      name: shm
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    modelFormat: vLLM
    openshift.io/display-name: flux2-klein-4b
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: 'true'
    security.opendatahub.io/auth-proxy-type: kube-rbac-proxy
  name: flux2-klein-4b
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '2'
          memory: 24Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '1'
          memory: 12Gi
          nvidia.com/gpu: '1'
      runtime: flux2-klein-4b
    timeout: 30
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    volumes:
      - name: model-dir
        persistentVolumeClaim:
          claimName: flux2-klein-4b
