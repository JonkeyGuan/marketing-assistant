apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    modelFormat: vLLM
    security.opendatahub.io/enable-auth: 'true'
    openshift.io/description: ''
    openshift.io/display-name: qwen25-coder-32b-fp8
    serving.kserve.io/deploymentMode: Standard
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    security.opendatahub.io/auth-proxy-type: kube-rbac-proxy
    opendatahub.io/connections: qwen25-coder-32b-fp8
    opendatahub.io/model-type: generative
  name: qwen25-coder-32b-fp8
  namespace: models
  finalizers:
    - odh.inferenceservice.finalizers
    - inferenceservice.finalizers
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - '--max-model-len=16384'
        - '--gpu-memory-utilization=0.95'
        - '--enable-auto-tool-choice'
        - '--tool-call-parser=hermes'
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '2'
          memory: 24Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '1'
          memory: 12Gi
          nvidia.com/gpu: '1'
      runtime: qwen25-coder-32b-fp8
      storageUri: 'pvc://qwen25-coder-32b'
    timeout: 30
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
