---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardrails-detector-ibm-hap
  labels:
    app.kubernetes.io/component: guardrails
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: Guardrails Detector ServingRuntime for KServe
  name: guardrails-detector-runtime-hap
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  storageHelper:
    disabled: true
  containers:
    - command: ["sh", "-c"]
      args:
        - |
          if [ ! -f "$MODEL_DIR/.download_complete" ]; then
            echo "[init] Downloading $HF_MODEL_ID to $MODEL_DIR ..."
            rm -rf "$MODEL_DIR"/* "$MODEL_DIR"/.* 2>/dev/null || true
            pip install --no-cache-dir --target /tmp/hf_lib -q 'huggingface_hub>=0.34,<1.0'
            PYTHONPATH=/tmp/hf_lib python3 -c "
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(os.environ['HF_MODEL_ID'], local_dir=os.environ['MODEL_DIR'])
          "
            touch "$MODEL_DIR/.download_complete"
            echo "[init] Download complete."
          else
            echo "[init] Model already exists at $MODEL_DIR, skipping download."
          fi
          exec uvicorn app:app --workers 4 --host 0.0.0.0 --port 8000 --log-config /common/log_conf.yaml
      env:
        - name: MODEL_DIR
          value: /mnt/models
        - name: HF_HOME
          value: /tmp/hf_home
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: HF_MODEL_ID
          value: ibm-granite/granite-guardian-hap-125m
      image: quay.io/trustyai/guardrails-detector-huggingface-runtime:latest
      name: kserve-container
      ports:
        - containerPort: 8000
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: guardrails-detector-huggingface
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    openshift.io/display-name: guardrails-detector-ibm-hap
    serving.kserve.io/deploymentMode: RawDeployment
  name: guardrails-detector-ibm-hap
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: guardrails-detector-huggingface
      name: ''
      resources:
        limits:
          cpu: '2'
          memory: 8Gi
        requests:
          cpu: '1'
          memory: 4Gi
      runtime: guardrails-detector-runtime-hap
    volumes:
      - name: model-dir
        persistentVolumeClaim:
          claimName: guardrails-detector-ibm-hap
